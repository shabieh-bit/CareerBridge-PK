<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | CareerBridge PK</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a href="index.html" class="brand"><img src="careerbridge-logo.png" alt="CareerBridge PK"></a><nav class="nav-links"><a href="index.html">Home</a><a href="student-profile.html">Student profile</a></nav></div></header><main><section class="page-hero"><div class="container page-hero-inner"><span class="eyebrow">Student account</span><h1>Welcome to CareerBridge.</h1><p>Sign in to store your profile and saved opportunities securely on the server.</p></div></section><section class="section"><div class="container" style="max-width:600px"><form class="prototype-form" id="auth-form"><label>Action<select id="auth-mode"><option value="register">Create account</option><option value="login">Sign in</option></select></label><label id="auth-name-wrap">Your name<input name="name" placeholder="Full name" autocomplete="name"></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" minlength="10" required><small>At least 10 characters.</small></label><button type="submit" class="btn" id="auth-submit">Create account</button><div class="form-result" id="auth-result" role="status"></div></form></div></section></main><script src="app.js"></script></body></html>
