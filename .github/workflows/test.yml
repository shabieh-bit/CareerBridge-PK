name: CareerBridge tests
on:
  push:
    branches: [main, feature/midterm-backend, feature/phase1-midterm-polish, feature/optional-cv-upload, feature/cv-jobs-action-plan]
  pull_request:
    branches: [main, feature/midterm-backend]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerbridge_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerbridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Initialize test database
        run: node -e "const {Client}=require('pg');const fs=require('fs');(async()=>{const db=new Client({connectionString:process.env.DATABASE_URL});await db.connect();await db.query(fs.readFileSync('schema.sql','utf8'));await db.end()})().catch(e=>{console.error(e);process.exit(1)})"
      - run: npm test
      - run: node --check server.js
      - run: node --check app.js
      - run: node --check dashboard.js
      - run: node --check cv.js
      - run: node --check career.js
      - run: node --check career-engine.js
      - run: node --check jobs-provider.js
      - run: node --check learning.js
      - run: node --check admin.js
